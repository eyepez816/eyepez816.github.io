name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A228C4: ${{ secrets.A228C4 }}
          B9D984: ${{ secrets.B9D984 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A228C4', '')
          env_b = os.environ.get('B9D984', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 593a1f0ca5bd118e2ddf91d96a3895a167a5 -->', env_a)
          if env_b:
              result = result.replace('<!-- b9efde27eb16580c84e157c46f4f -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
